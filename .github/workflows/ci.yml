name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: factory
          POSTGRES_DB: factory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U factory -d factory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      vault:
        image: hashicorp/vault:1.20
        env:
          VAULT_DEV_ROOT_TOKEN_ID: dev-only-token
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports:
          - 8200:8200
        options: >-
          --health-cmd "vault status -address=http://127.0.0.1:8200"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://factory:factory@localhost:5432/factory
      TEST_VAULT_ADDR: http://localhost:8200
      TEST_VAULT_TOKEN: dev-only-token
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck, test, and build
        run: npm run check
      - name: Enforce browser bundle budgets
        run: npm run check:bundle
      - name: Install Chromium for IDE browser smoke
        run: npx playwright install --with-deps chromium
      - name: IDE browser smoke gate
        run: npm run test:browser
      - name: Coding workflow integration gate
        run: npm run test:coding-workflow
      - name: Container sandbox smoke gate
        run: |
          docker pull node:22-bookworm-slim
          DOCKER_CHECK_SMOKE=1 npm test -- --run src/repository/workspace.test.ts

  image-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag agentic-workflow-factory:ci .
      - name: Enforce production image budget
        run: npm run check:image -- agentic-workflow-factory:ci
