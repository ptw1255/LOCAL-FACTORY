receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  batch:
    timeout: 1s
  # Defense in depth: the factory already redacts payloads, but the collector
  # must not forward credential-like attributes if a future producer regresses.
  attributes/redact:
    actions:
      - key: authorization
        action: delete
      - key: api.key
        action: delete
      - key: api_key
        action: delete
      - key: token
        action: delete
      - key: secret
        action: delete
      - key: gen_ai.prompt
        action: delete
      - key: gen_ai.completion
        action: delete
      - key: llm.prompt
        action: delete
      - key: llm.output
        action: delete

exporters:
  otlp/phoenix:
    endpoint: phoenix:4317
    tls:
      insecure: true
service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, batch]
      exporters: [otlp/phoenix]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, batch]
      exporters: [otlp/phoenix]
