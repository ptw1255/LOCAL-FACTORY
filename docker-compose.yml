services:
  app:
    build: .
    ports:
      - "3100:3100"
    environment:
      HOST: 0.0.0.0
      PORT: 3100
      DATABASE_URL: postgresql://factory:factory@postgres:5432/factory
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: dev-only-token
      OBSERVABILITY_RETENTION_HOURS: 48
      # Ollama normally runs on the host during local development. Override with
      # OLLAMA_BASE_URL=http://ollama:11434 when using the optional Compose service.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # Set PHOENIX_ENDPOINT=http://phoenix:6006 when enabling the observability profile.
      PHOENIX_ENDPOINT: ${PHOENIX_ENDPOINT:-}
      # Browser-facing Phoenix URL; keep the collector endpoint internal to Docker.
      PHOENIX_UI_URL: ${PHOENIX_UI_URL:-http://localhost:6006}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3100/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - app_data:/app/.data
      - artifact_data:/app/.data/artifacts
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: factory
      POSTGRES_DB: factory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory -d factory"]
      interval: 5s
      timeout: 5s
      retries: 10

  vault:
    image: hashicorp/vault:1.20
    command: server -dev -dev-root-token-id=dev-only-token
    environment:
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 5s
      retries: 10

  phoenix:
    image: arizephoenix/phoenix:latest
    profiles: ["observability"]
    environment:
      # Phoenix retention is expressed in days; two days matches the factory's 48-hour policy.
      PHOENIX_DEFAULT_RETENTION_POLICY_DAYS: 2
      PHOENIX_ALLOW_EXTERNAL_RESOURCES: "false"
    ports:
      - "6006:6006"
      - "4317:4317"
    volumes:
      - phoenix_data:/root/.phoenix
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  app_data:
  postgres_data:
  phoenix_data:
  ollama_data:
  artifact_data:
